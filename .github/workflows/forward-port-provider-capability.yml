name: Forward-port provider namespace capability

on:
  push:
    branches:
      - codex/lmstudio-automation
    paths:
      - .github/workflows/forward-port-provider-capability.yml
  pull_request:
    branches:
      - codex/lmstudio-automation
    paths:
      - .github/workflows/forward-port-provider-capability.yml
      - lmstudio-automation/PLAN.md

permissions:
  contents: write

concurrency:
  group: forward-port-provider-capability
  cancel-in-progress: false

jobs:
  forward-port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: codex/lmstudio-automation
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch pinned upstream PR 29602
        shell: bash
        run: |
          set -euo pipefail

          pr_ref="refs/remotes/upstream/pr-29602"
          expected_sha="42961ed49bb490ff33f93e4ebbc091168af10173"

          git fetch --no-tags https://github.com/openai/codex.git \
            "refs/pull/29602/head:${pr_ref}"

          actual_sha="$(git rev-parse "${pr_ref}")"
          if [[ "${actual_sha}" != "${expected_sha}" ]]; then
            echo "PR 29602 changed since this workflow was reviewed." >&2
            echo "Expected: ${expected_sha}" >&2
            echo "Actual:   ${actual_sha}" >&2
            exit 1
          fi

      - name: Apply upstream PR 29602
        shell: bash
        run: |
          set -euo pipefail

          pr_ref="refs/remotes/upstream/pr-29602"
          pr_base="d2484697b1f9ce33d1d818ccad859ca3a4d721c6"

          git diff --binary "${pr_base}" "${pr_ref}" \
            > /tmp/pr-29602.patch

          test -s /tmp/pr-29602.patch
          git apply --3way /tmp/pr-29602.patch

